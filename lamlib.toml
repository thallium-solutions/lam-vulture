[library]
name = "@lam/vulture"
version = "3.0.0"
description = "Fastify-style HTTP server for Lammergeier"
license = "Apache-2.0"
authors = ["Lammergeier contributors"]
repository = "https://github.com/thallium-solutions/lam-vulture"
homepage = "https://github.com/thallium-solutions/lam-vulture"

[compatibility]
lamc = ">=4.0, <5"

[scripts]
test = "python3 tests/run_tests.py --verbose"
format = "lamc fmt ."
check = "lamc fmt . --check"
